name: code-sanitation
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Project to scan"
        type: choice
        required: true
        options:
          - mfdweb
          - wealthupp_web_ng_ai
      ref:
        description: "Branch or tag to scan"
        required: true
        default: main
      release:
        description: "Release name for the report (e.g. v2.15.0)"
        required: true

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  # 1. Code scan (OWASP Top 10)
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OWNER }}/${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SCAN_READ_TOKEN }}
      - name: Semgrep scan
        run: semgrep scan --config p/owasp-top-ten --json --output semgrep.json
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

  # 2. Library + secrets scan
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OWNER }}/${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SCAN_READ_TOKEN }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: json
          output: trivy.json
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.json

  # 3. Send both reports to DefectDojo
  upload:
    needs: [semgrep, trivy]
    runs-on: ubuntu-latest
    env:
      DD_URL: ${{ secrets.DD_URL }}
      DD_TOKEN: ${{ secrets.DD_TOKEN }}
      PRODUCT: ${{ inputs.repo }}
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: semgrep-report
      - uses: actions/download-artifact@v4
        with:
          name: trivy-report
      - name: Upload to DefectDojo
        run: |
          upload () {
            curl -sS --fail-with-body -X POST "$DD_URL/api/v2/reimport-scan/" \
              -H "Authorization: Token $DD_TOKEN" \
              -F "scan_type=$1" -F "file=@$2" -F "test_title=$3" \
              -F "product_type_name=WealthUpp" -F "product_name=$PRODUCT" \
              -F "engagement_name=$RELEASE" \
              -F "auto_create_context=true" -F "close_old_findings=true"
          }
          upload "Semgrep JSON Report" semgrep.json Semgrep
          upload "Trivy Scan" trivy.json Trivy
